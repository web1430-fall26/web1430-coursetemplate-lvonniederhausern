<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 2 Interactive Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Assignment 2 Interactive Calculator</h1>
    <p id = "larger">Tip and bill splitter: takes a meal total, tip percentage, and number of people; outputs each person's share</p>
    <section class="tip-calculator">
      <h2>Tip and Bill Calculator</h2>

      <div class="field-group" >
        <label for="meal-total">Meal Total ($)</label>
        <input type="number" id="meal-total" aria-describedby="total-price-input" aria-invalid="false" min="0" step="0.01" value="0.00">
      </div>

      <div class="field-group" >
        <label for="tip-percentage">Tip Percentage (%)</label>
        <input type="number" id="tip-percentage" aria-describedby="tip-percent-input" aria-invalid="false" min="0" max="100" value="15">
      </div>

      <div class="field-group">
        <label for="num-people">Number of People</label>
        <input type="number" id="num-people" aria-describedby="number-of-people-input" aria-invalid="false" min="1" value="1">
      </div>

      <button type="button" id="calculate-btn">Calculate</button>

      <div id="result-output" aria-live="polite"></div>
    </section>
    <section class = 'history'>
      <p id = "larger">Last Calculation Result:</p>
    <p id="past-results"></p>
    <p id = "larger" >Calculation History (past 3 results):</p>
    <p id="history-list"></p>

    </section>
        <p id="debug-output-text"></p>
  </main>
  <script defer src="calc.js"></script>
</body>
</html>
